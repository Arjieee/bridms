# Render Blueprint Deployment Configuration
# https://render.com/docs/blueprint-spec

databases:
  - name: puerto-db
    databaseName: bridms
    user: bridms_user
    plan: free

services:
  - type: web
    name: barangay-puerto-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && node prisma/seed.js
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: puerto-db
          property: connectionString
