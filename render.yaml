# Render Blueprint Deployment Configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: barangay-puerto-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma db push && node prisma/seed.js
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
